[package]
name = "shyissh-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shyissh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE (2026-10-28): tauri 2.12.5 (wry 0.57.1 / webview2-com 0.39.1 / windows 0.62)
# panics at startup on this machine with:
#   Failed to setup app: failed to create webview: WebView2 error 0x8000FFFF (灾难性故障)
# Pinned to tauri 2.10.3 (wry 0.54.x / webview2-com 0.38.2), which works.
# tauri-plugin-opener was removed because 2.7.2 requires tauri ^2.12 and the frontend
# does not call it; re-add a 2.5/2.6 line when needed.
tauri = { version = "=2.10.3", features = [] }
tauri-macros = "=2.5.5"
tauri-utils = "=2.8.3"
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
webview2-com = "=0.38.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
